<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - BCP Uniform Guide</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%),
                        url('https://images.unsplash.com/photo-1557683316-973673baf926?w=1920&q=80') center/cover no-repeat fixed;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 20s infinite ease-in-out;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 15s infinite ease-in-out reverse;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .login-page-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease-out;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-page-header {
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-page-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-page-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .login-page-icon i {
            font-size: 3.5rem;
            color: white;
            position: relative;
            z-index: 1;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-page-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-page-header p {
            color: var(--text-secondary);
            margin-bottom: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-page-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-page-footer p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .login-page-footer i {
            color: var(--primary-color);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .back-link:hover {
            gap: 0.75rem;
        }

        .demo-accounts {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), rgba(59, 130, 246, 0.05));
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .demo-accounts h4 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .demo-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .demo-item {
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .demo-item strong {
            color: var(--primary-color);
            display: inline-block;
            min-width: 80px;
        }

        /* Form elements transitions */
        .form-group {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-link {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Responsive transitions */
        @media (max-width: 768px) {
            body::before {
                width: 350px;
                height: 350px;
                top: -175px;
                right: -175px;
            }

            body::after {
                width: 300px;
                height: 300px;
                bottom: -150px;
                left: -150px;
            }
        }

        @media (max-width: 480px) {
            .login-page-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
                border-radius: 20px;
            }

            .login-page-icon {
                width: 80px;
                height: 80px;
            }

            .login-page-icon i {
                font-size: 3rem;
            }

            .login-page-header h1 {
                font-size: 1.75rem;
            }

            body::before {
                width: 250px;
                height: 250px;
                top: -125px;
                right: -125px;
            }

            body::after {
                width: 200px;
                height: 200px;
                bottom: -100px;
                left: -100px;
            }

            .demo-accounts {
                padding: 1rem;
            }

            .demo-item {
                padding: 0.65rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-page-container">
        <div class="login-page-header">
            <div class="login-page-icon">
                <i class="fas fa-user-circle"></i>
            </div>
            <h1>Student Login</h1>
            <p>Login to access the BCP Uniform Guide</p>
        </div>
        
        <form id="loginPageForm">
            <div class="form-group">
                <label for="loginStudentId"><i class="fas fa-user"></i> Email or Student ID</label>
                <input type="text" id="loginStudentId" required placeholder="Enter your email or student ID" autofocus>
            </div>
            <div class="form-group">
                <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="loginPassword" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary btn-large">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div class="login-page-footer">
            <div class="demo-accounts">
                <h4><i class="fas fa-users"></i> Demo Accounts</h4>
                <div class="demo-list">
                    <div class="demo-item">
                        <strong>Student 2:</strong> juan.delacruz@bcp.edu.ph / student123
                    </div>
                </div>
            </div>
            <p style="margin-top: 1.5rem;"><i class="fas fa-info-circle"></i> Contact your administrator to get login credentials</p>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="data.js"></script>
    <script>
        // Simulated user database
        let users = JSON.parse(localStorage.getItem('bcpUsers')) || [];

        // Handle Login
        document.getElementById('loginPageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const identifier = document.getElementById('loginStudentId').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // Check if user exists with either email or student ID
            const user = users.find(u => 
                (u.email === identifier || u.studentId === identifier) && u.password === password
            );
            
            if (user) {
                const currentUser = {
                    id: user.id,
                    name: user.name,
                    email: user.email,
                    studentId: user.studentId,
                    gender: user.gender
                };
                
                localStorage.setItem('bcpCurrentUser', JSON.stringify(currentUser));
                showToast(`Welcome back, ${currentUser.name}!`, 'success');
                
                // Redirect to main page after short delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showToast('Invalid email/student ID or password', 'error');
            }
        });

        // Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Check if already logged in
        const currentUser = JSON.parse(localStorage.getItem('bcpCurrentUser'));
        if (currentUser) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
