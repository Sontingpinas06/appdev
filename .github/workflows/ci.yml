# Acceptance gates on every push/PR: typecheck + build the client, boot the
# API against a Postgres service, run every server gate, then the Playwright
# smoke test against Vite (Chrome is preinstalled on ubuntu runners).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uniguide
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/uniguide
      CLIENT_ORIGINS: http://localhost:5173
      DB_SYNC: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Typecheck and build the client
        working-directory: client
        run: |
          npx tsc --noEmit
          npm run build

      - name: Start the API
        working-directory: server
        run: |
          nohup npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'API failed to start'; cat api.log; exit 1

      - name: Start Vite
        working-directory: client
        run: |
          nohup npm run dev > vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Vite failed to start'; cat vite.log; exit 1

      - name: Server acceptance gates
        working-directory: server
        run: |
          npm run check:auth
          npm run check:orders
          npm run check:payments
          npm run check:scan
          npm run check:security
          npm run check:parity
          npm run check:migrations

      - name: E2E smoke (Playwright + Chrome)
        working-directory: client
        run: npm run smoke

      - name: Restore stock after test orders
        working-directory: server
        run: npm run reset:stock

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            server/api.log
            client/vite.log
          if-no-files-found: ignore
